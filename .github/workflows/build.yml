name: Build Windows EXE & macOS Universal DMGs

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 1. Windows (.exe) ビルドジョブ
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build Windows EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "InstantDeliveryStudio" --collect-all customtkinter --collect-all tkinterdnd2 app.py

      - name: Prepare Windows distribution folder
        run: |
          mkdir dist\package_win
          mkdir dist\package_win\fonts
          copy dist\InstantDeliveryStudio.exe dist\package_win\

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-Windows
          path: dist/package_win/
          retention-days: 30

  # ==========================================
  # 2. macOS (Apple Silicon: M1/M2/M3/M4) ビルド
  # ==========================================
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build macOS .app (Apple Silicon)
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          pyinstaller --noconsole --onefile --windowed \
            --name "InstantDeliveryStudio" \
            --osx-bundle-identifier "com.pogo.instantdeliverystudio" \
            --codesign-identity - \
            --collect-all customtkinter \
            --collect-all tkinterdnd2 \
            app.py

      - name: Create macOS .dmg (Apple Silicon)
        run: |
          mkdir -p dist/dmg_root/fonts
          ditto dist/InstantDeliveryStudio.app dist/dmg_root/InstantDeliveryStudio.app
          codesign --force --deep --sign - dist/dmg_root/InstantDeliveryStudio.app
          hdiutil create -volname "InstantDeliveryStudio" \
            -srcfolder dist/dmg_root \
            -ov -format UDZO \
            dist/InstantDeliveryStudio-macOS-AppleSilicon.dmg

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-macOS-AppleSilicon
          path: dist/InstantDeliveryStudio-macOS-AppleSilicon.dmg
          retention-days: 30

  # ==========================================
  # 3. macOS (Intel Mac & Rosetta 2 互換) ビルド
  # ==========================================
  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build macOS .app (Intel x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          pyinstaller --noconsole --onefile --windowed \
            --name "InstantDeliveryStudio" \
            --osx-bundle-identifier "com.pogo.instantdeliverystudio" \
            --codesign-identity - \
            --collect-all customtkinter \
            --collect-all tkinterdnd2 \
            app.py

      - name: Create macOS .dmg (Intel x86_64)
        run: |
          mkdir -p dist/dmg_root/fonts
          ditto dist/InstantDeliveryStudio.app dist/dmg_root/InstantDeliveryStudio.app
          codesign --force --deep --sign - dist/dmg_root/InstantDeliveryStudio.app
          hdiutil create -volname "InstantDeliveryStudio" \
            -srcfolder dist/dmg_root \
            -ov -format UDZO \
            dist/InstantDeliveryStudio-macOS-Intel.dmg

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-macOS-Intel
          path: dist/InstantDeliveryStudio-macOS-Intel.dmg
          retention-days: 30
