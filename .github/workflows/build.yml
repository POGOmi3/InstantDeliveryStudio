name: Build Windows EXE & macOS DMG

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Node.js 20 の非推奨警告を解消
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 1. Windows (.exe) ビルドジョブ
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build Windows EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "InstantDeliveryStudio" --collect-all customtkinter --collect-all tkinterdnd2 app.py

      - name: Prepare Windows distribution folder
        run: |
          mkdir dist\package_win
          mkdir dist\package_win\fonts
          copy dist\InstantDeliveryStudio.exe dist\package_win\

      # upload-artifactが自動でZIP化するため、フォルダを直接指定して二重ZIPを防ぐ
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-Windows
          path: dist/package_win/
          retention-days: 30

  # ==========================================
  # 2. macOS (.dmg) ビルドジョブ
  # ==========================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build macOS .app Bundle with PyInstaller
        run: |
          pyinstaller --noconsole --windowed --name "InstantDeliveryStudio" --collect-all customtkinter --collect-all tkinterdnd2 app.py

      - name: Code Sign & Create macOS .dmg Installer
        run: |
          # シンボリックリンクを壊さないよう ditto で複製
          mkdir -p dist/dmg_root/fonts
          ditto dist/InstantDeliveryStudio.app dist/dmg_root/InstantDeliveryStudio.app

          # Apple Silicon対応のアドホック署名
          codesign --force --deep --sign - dist/dmg_root/InstantDeliveryStudio.app

          # Mac標準の hdiutil で解凍エラーが起きない .dmg ファイルを生成
          hdiutil create -volname "InstantDeliveryStudio" \
            -srcfolder dist/dmg_root \
            -ov -format UDZO \
            dist/InstantDeliveryStudio-macOS.dmg

      - name: Upload macOS Artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-macOS-DMG
          path: dist/InstantDeliveryStudio-macOS.dmg
          retention-days: 30
