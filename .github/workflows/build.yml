name: Build Windows EXE & macOS APP

on:
  # mainブランチへのプッシュ時に自動実行
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  # GitHubの「Actions」タブからボタン1つで手動実行も可能にする
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Windows (.exe) ビルドジョブ
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build Windows EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "InstantDeliveryStudio" --collect-all customtkinter --collect-all tkinterdnd2 app.py

      - name: Prepare Windows distribution package
        run: |
          mkdir dist\InstantDeliveryStudio_Windows
          mkdir dist\InstantDeliveryStudio_Windows\fonts
          copy dist\InstantDeliveryStudio.exe dist\InstantDeliveryStudio_Windows\
          Compress-Archive -Path dist\InstantDeliveryStudio_Windows\* -DestinationPath dist\InstantDeliveryStudio-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-Windows
          path: |
            dist/InstantDeliveryStudio.exe
            dist/InstantDeliveryStudio-Windows-x64.zip
          retention-days: 30

  # ==========================================
  # 2. macOS (.app) ビルドジョブ
  # ==========================================
  build-macos:
    runs-on: macos-14  # Apple Silicon (M1/M2/M3/M4) ネイティブ対応ランナー
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (with Tkinter support)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install Pillow piexif customtkinter tkinterdnd2 pyinstaller

      - name: Build macOS .app Bundle with PyInstaller
        run: |
          pyinstaller --noconsole --windowed --name "InstantDeliveryStudio" --collect-all customtkinter --collect-all tkinterdnd2 app.py

      - name: Ad-hoc Code Sign & Package for macOS
        run: |
          # Apple Silicon環境での「破損しているため開けません」を防ぐアドホック署名
          codesign --force --deep --sign - dist/InstantDeliveryStudio.app

          # 配布用フォルダ構成の作成（.appのすぐ横にfontsフォルダを同梱）
          mkdir -p dist/mac_package/fonts
          cp -R dist/InstantDeliveryStudio.app dist/mac_package/

          # Mac標準のdittoコマンドで実行権限・シンボリックリンクを完全維持したままZIP化
          ditto -c -k --sequesterRsrc dist/mac_package dist/InstantDeliveryStudio-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantDeliveryStudio-macOS
          path: dist/InstantDeliveryStudio-macOS.zip
          retention-days: 30

  # ==========================================
  # 3. タグ(v1.0等)プッシュ時はReleasesに自動公開
  # ==========================================
  create-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/InstantDeliveryStudio-Windows/InstantDeliveryStudio-Windows-x64.zip
            artifacts/InstantDeliveryStudio-macOS/InstantDeliveryStudio-macOS.zip
          generate_release_notes: true
